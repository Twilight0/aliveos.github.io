title: AliveOS
description: >-
  A minimalist, Arch-based, developer-optimized Linux distribution, designed for
  essential performance and a clean workflow.
url: "https://aliveos.org"
baseurl: ""
future: true

# Section-fixed post URLs: /updates/<post-slug>/ by default,
# /news/<post-slug>/ is set explicitly per-post on news items.
permalink: /updates/:title/

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

# Whitelisted on GitHub Pages: RSS feed + sitemap + redirect stubs
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

# Don't publish repo meta files to the live site
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - "*.gemspec"
  - vendor
  - VALUABLE_INFO.md

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: pages
    values:
      layout: default
