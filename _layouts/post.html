---
layout: default
---
<article class="post">
    <header class="post-header">
        <h2 class="post-title">{{ page.title }}</h2>
        <p class="post-meta">
            {{ page.date | date: "%B %d, %Y" }}{% if page.author %} &middot; {{ page.author }}{% endif %}
        </p>
    </header>
    <div class="post-content">
        {{ content }}
    </div>
    <p class="post-back"><a href="/news/">&larr; Back to News</a></p>

    <div class="post-comments">
        <script src="https://giscus.app/client.js"
            data-repo="Twilight0/aliveos.github.io"
            data-repo-id="R_kgDOTMk2XQ"
            data-category="Announcements"
            data-category-id="DIC_kwDOTMk2Xc4DB7d8"
            data-mapping="pathname"
            data-strict="0"
            data-reactions-enabled="1"
            data-emit-metadata="0"
            data-input-position="top"
            data-theme="transparent_dark"
            data-lang="en"
            data-loading="lazy"
            crossorigin="anonymous"
            async>
        </script>
    </div>
</article>
