---
layout: default
---
<article class="post">
    <header class="post-header">
        <h2 class="post-title">{{ page.title }}</h2>
        <p class="post-meta">
            {{ page.date | date: "%B %d, %Y" }}{% if page.author %} &middot; {{ page.author }}{% endif %}
        </p>
    </header>
    <div class="post-content">
        {{ content }}
    </div>

    <div class="share-buttons">
        <span class="share-label">Share this post:</span>
        <a class="share-btn share-twitter" href="https://twitter.com/intent/tweet?url={{ page.url | absolute_url | urlencode }}&text={{ page.title | urlencode }}" target="_blank" rel="noopener noreferrer">Twitter</a>
        <a class="share-btn share-facebook" href="https://www.facebook.com/sharer/sharer.php?u={{ page.url | absolute_url | urlencode }}" target="_blank" rel="noopener noreferrer">Facebook</a>
        <a class="share-btn share-reddit" href="https://reddit.com/submit?url={{ page.url | absolute_url | urlencode }}&title={{ page.title | urlencode }}" target="_blank" rel="noopener noreferrer">Reddit</a>
        <a class="share-btn share-linkedin" href="https://www.linkedin.com/shareArticle?mini=true&url={{ page.url | absolute_url | urlencode }}&title={{ page.title | urlencode }}" target="_blank" rel="noopener noreferrer">LinkedIn</a>
    </div>

    <p class="post-back"><a href="/news/">&larr; Back to News</a></p>

    <div class="post-comments">
        <script src="https://giscus.app/client.js"
            data-repo="Twilight0/aliveos.github.io"
            data-repo-id="R_kgDOTMk2XQ"
            data-category="Announcements"
            data-category-id="DIC_kwDOTMk2Xc4DB7d8"
            data-mapping="pathname"
            data-strict="0"
            data-reactions-enabled="1"
            data-emit-metadata="0"
            data-input-position="top"
            data-theme="transparent_dark"
            data-lang="en"
            data-loading="lazy"
            crossorigin="anonymous"
            async>
        </script>
    </div>
</article>
